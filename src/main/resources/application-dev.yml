spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barberpro}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    # Roda schema-postgresql.sql depois que o Hibernate cria/atualiza as tabelas.
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: postgresql
